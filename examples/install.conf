# Config parser: KEY=VALUE only. Comments must be on their own line.
ALERT_EMAIL="alert@example.net"
MAIL_MODE="existing"
RELAY_HOST=""
RELAY_PORT="25"
RELAY_TLS_MODE="verify"
RELAY_AUTH="no"
RELAY_USER=""

# IP singoli e/o reti CIDR, separati da virgola/spazio.
TRUSTED_SOURCES="192.168.2.43,10.0.10.98,10.0.20.0/24"
SSH_PORT="22"
ENABLE_LOCKDOWN="no"
LOCKDOWN_KEEP_ESTABLISHED="no"
# auto|nftables|iptables|firewalld|none
FIREWALL_BACKEND="auto"

# Ban dinamici: local, openwrt oppure local,openwrt
BAN_BACKENDS="local"
FAIL2BAN_INTEGRATION="no"

OPENWRT_REMOTE_ENABLE="no"
OPENWRT_HOST=""
OPENWRT_PORT="22"
OPENWRT_USER="root"
OPENWRT_IDENTITY_FILE="/etc/ir-stack/openwrt_ed25519"
OPENWRT_KNOWN_HOSTS="/etc/ir-stack/openwrt_known_hosts"
