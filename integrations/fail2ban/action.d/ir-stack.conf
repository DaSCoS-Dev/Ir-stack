# IR Stack Fail2Ban action. Use from a jail with: banaction = ir-stack
[Definition]
actionstart = /usr/local/sbin/ir-ban check
actioncheck = /usr/local/sbin/ir-ban check
actionban = /usr/local/sbin/ir-ban add <ip>
actionunban = /usr/local/sbin/ir-ban del <ip>
